name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/html-gta-vc-maps-game-hqnh4b]
  workflow_dispatch:

# configure-pages needs pages:write to turn Pages on the first time it runs
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # the game is a single self-contained index.html, so the repo root is the site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
